<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeEgg Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-wrapper">
    <div id="top-tabs">
        <div class="tab active" data-tab="profile" onclick="switchTab('profile')">프로필</div>
        <div class="tab" data-tab="inventory" onclick="switchTab('inventory')" style="display:none;">인벤토리</div>
        <div class="tab" data-tab="gacha" onclick="switchTab('gacha')" style="display:none;">뽑기</div>
        <div class="tab" data-tab="combine" onclick="switchTab('combine')" style="display:none;">조합</div>
        <div class="tab" data-tab="auction" onclick="switchTab('auction')" style="display:none;">경매장</div>
        <div class="tab" data-tab="leaderboard" onclick="switchTab('leaderboard')" style="display:none;">랭킹</div>
        <div id="loading-icon"></div>
    </div>

    <div id="game-container">
        <!-- ===== 로딩 화면 ===== -->
        <div id="loading-screen" class="view-content">
            <div id="loading-screen-content">
                <div id="loading-screen-title">Loading</div>
                <div id="loading-screen-message">초기화 중...</div>
                <div id="loading-bar-container">
                    <div id="loading-bar-fill"></div>
                </div>
                <div id="loading-percent">0%</div>
            </div>
        </div>

        <!-- ===== 프로필 화면 ===== -->
        <div id="profile-view" class="view-content active">
            <!-- 로그인 화면 -->
            <div id="login-screen">
                <div id="login-title">PokeEgg</div>
                <div id="login-form">
                    <div id="login-fields">
                        <input type="text" id="login-nickname" placeholder="닉네임" maxlength="20">
                        <input type="password" id="login-password" placeholder="비밀번호" maxlength="30">
                    </div>
                    <button id="login-btn">로그인</button>
                </div>
            </div>

            <!-- 프로필 메인 화면 -->
            <div id="profile-main" style="display:none;">
                <div id="profile-left">
                    <div id="profile-avatar-box">
                        <img id="profile-avatar" src="" alt="avatar">
                    </div>
                    <div id="profile-info">
                        <div class="profile-row"><span class="profile-label">닉네임</span><span id="profile-nickname" class="profile-value">-</span></div>
                        <div class="profile-row"><span class="profile-label">파트너</span><span id="profile-partner" class="profile-value">-</span></div>
                        <div class="profile-row"><span class="profile-label">보유 PT</span><span id="profile-pt" class="profile-value">0 pt</span></div>
                        <div class="profile-row"><span class="profile-label">실버코인</span><span id="profile-silver" class="profile-value">0</span></div>
                        <div class="profile-row"><span class="profile-label">골드코인</span><span id="profile-gold" class="profile-value">0</span></div>
                        <div class="profile-row"><span class="profile-label">CP</span><span id="profile-cp" class="profile-value">0 cp</span></div>
                        <div class="profile-row"><span class="profile-label">도감</span><span id="profile-dex" class="profile-value">0마리</span></div>
                        <div class="profile-row"><span class="profile-label">플레이 시간</span><span id="profile-playtime" class="profile-value">00:00:00</span></div>
                        <div class="profile-row"><span class="profile-label">모험 시작일</span><span id="profile-startdate" class="profile-value">-</span></div>
                    </div>
                    <div id="profile-actions">
                        <button id="btn-logout" class="dp-btn red-btn">로그아웃</button>
                        <button id="btn-delete-account" class="dp-btn red-btn">계정 삭제</button>
                    </div>
                </div>
                <div id="profile-right">
                    <!-- 캐릭터 선택 화면 (아바타 클릭 시만 표시) -->
                    <div id="profile-char-section" style="display:none;">
                        <div id="profile-char-title">캐릭터 선택</div>
                        <div id="profile-char-grid">
                            <!-- 캐릭터 셀들이 JS로 동적 생성됨 -->
                        </div>
                    </div>
                    <!-- 도감 화면 (기본 표시) -->
                    <div id="profile-dex-section">
                        <div id="profile-dex-title">도감</div>
                        <div id="profile-dex-grid-wrapper">
                            <div id="profile-dex-grid"></div>
                        </div>
                        <div id="profile-dex-action-bar">
                            <button id="btn-set-partner" class="dp-btn" disabled>파트너 포켓몬으로 지정</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- ===== 인벤토리 화면 ===== -->
        <div id="inventory-view" class="view-content">
            
            <div id="left-panel">
                <div class="name-plate">
                    <div class="name-plate-left">
                        <span id="pokemon-name"></span>
                        <span id="pokemon-count-badge" class="count-badge-name">
                            <img id="pokemon-ball-icon-name" alt="ball" style="width:16px;height:16px;vertical-align:middle;image-rendering:pixelated;">
                            <span id="pokemon-count-name">0</span>
                        </span>
                    </div>
                    <span id="pokemon-no">No.---</span>
                </div>
                
                <div class="portrait-box">
                    <img id="pokemon-sprite" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="sprite">
                </div>
                
                <div class="info-plate">
                    <div class="info-header">
                        <span>서식지: <span id="pokemon-habitat">-</span></span>
                        <div id="type-badges" class="type-container"></div>
                    </div>
                    <div class="tier-price-row">
                        <div>등급: <span id="pokemon-tier">-</span></div>
                        <div>가격: <span id="pokemon-price">0</span> pt</div>
                    </div>
                    <div class="habitat-row">
                        <span>지닌물건: <span id="pokemon-held-item">없음</span></span>
                    </div>
                    <div class="desc-row" id="pokemon-description"></div>
                    <div id="pokemon-stats" class="stats-grid"></div>
                </div>
            </div>

            <div id="right-panel">
                
                <div id="currency-bar">
                    <div class="currency-item">
                        <span id="points-display" class="currency-value">0 pt</span>
                    </div>
                    <div class="currency-item">
                        <img id="silver-coin-icon" alt="silver">
                        <span id="silver-coin-display" class="currency-value">0</span>
                    </div>
                    <div class="currency-item">
                        <img id="gold-coin-icon" alt="gold">
                        <span id="gold-coin-display" class="currency-value">0</span>
                    </div>
                    <div class="currency-item" style="margin-left: auto;">
                        <img id="pokemon-ball-icon" alt="ball">
                        보유 포켓몬: <span id="pokemon-count-total-display" class="currency-value">0</span>
                    </div>
                </div>

                <div id="filter-bar">
                    <div class="filter-btn-wrapper">
                        <button class="filter-btn" onclick="toggleModal('gen-modal')">세대 ▾</button>
                        <span class="filter-badge" id="filter-badge-gen">0</span>
                        <div id="gen-modal" class="filter-modal">
                            <div class="filter-item active" data-value="all" onclick="toggleFilter(this, 'gen', 'all')">
                                <div class="filter-checkbox"></div> 전체
                            </div>
                            <div class="filter-item" data-value="1" onclick="toggleFilter(this, 'gen', '1')">
                                <div class="filter-checkbox"></div> 1세대
                            </div>
                        </div>
                    </div>
                    <div class="filter-btn-wrapper">
                        <button class="filter-btn" onclick="toggleModal('tier-modal')">등급 ▾</button>
                        <span class="filter-badge" id="filter-badge-tier">0</span>
                        <div id="tier-modal" class="filter-modal">
                            <!-- JS에서 동적 생성 예정 -->
                        </div>
                    </div>
                    <div class="filter-btn-wrapper">
                        <button class="filter-btn" onclick="toggleModal('type-modal')">타입 ▾</button>
                        <span class="filter-badge" id="filter-badge-type">0</span>
                        <div id="type-modal" class="filter-modal">
                            <!-- JS에서 동적 생성 예정 -->
                        </div>
                    </div>
                    <div class="filter-btn-wrapper">
                        <button class="filter-btn" onclick="toggleModal('habitat-modal')">서식지 ▾</button>
                        <span class="filter-badge" id="filter-badge-habitat">0</span>
                        <div id="habitat-modal" class="filter-modal">
                            <!-- JS에서 동적 생성 예정 -->
                        </div>
                    </div>
                    <button id="sort-btn" onclick="toggleSort()">
                        <span class="sort-arrow">▲</span> 도감번호
                    </button>
                </div>

                <div id="grid-wrapper" class="grid-wrapper">
                    <div id="inventory-grid"></div>
                </div>

                <div id="action-bar">
                    <div id="normal-btns" class="action-group">
                        <button class="dp-btn pink" id="btn-select" onclick="toggleSelectMode(true)">선택</button>
                        <button id="btn-evolve" class="dp-btn green" disabled>진화</button>
                        <button id="btn-convert" class="dp-btn" disabled>포인트 변환</button>
                        <button id="btn-auction" class="dp-btn" disabled>경매장 등록</button>
                    </div>
                    <div id="select-btns" class="action-group" style="display: none;">
                        <span id="select-count-display" class="select-count-text">선택: 0</span>
                        <button class="dp-btn" onclick="toggleSelectAll()">전체 선택</button>
                        <button id="btn-convert-multi" class="dp-btn" disabled>포인트 변환</button>
                        <button class="dp-btn red-btn" onclick="toggleSelectMode(false)">취소</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 뽑기 화면 ===== -->
        <div id="gacha-view" class="view-content empty-view">
            뽑기 화면 (준비중)
        </div>

        <!-- ===== 조합 화면 ===== -->
        <div id="combine-view" class="view-content">
            <!-- 상단 패널: 슬롯 + 확률표 + 조합 버튼 -->
            <div id="combine-top">
                <div id="combine-slots">
                    <div class="combine-slot" data-slot="0">
                        <div class="combine-slot-inner">
                            <div class="combine-slot-type-badge"></div>
                            <div class="combine-slot-sprite"></div>
                            <div class="combine-slot-name"></div>
                        </div>
                    </div>
                    <div class="combine-plus">+</div>
                    <div class="combine-slot" data-slot="1">
                        <div class="combine-slot-inner">
                            <div class="combine-slot-type-badge"></div>
                            <div class="combine-slot-sprite"></div>
                            <div class="combine-slot-name"></div>
                        </div>
                    </div>
                    <div class="combine-plus">+</div>
                    <div class="combine-slot" data-slot="2">
                        <div class="combine-slot-inner">
                            <div class="combine-slot-type-badge"></div>
                            <div class="combine-slot-sprite"></div>
                            <div class="combine-slot-name"></div>
                        </div>
                    </div>
                    <div class="combine-eq">=</div>
                    <div class="combine-slot combine-result-slot" data-slot="3">
                        <div class="combine-slot-inner">
                            <div class="combine-slot-type-badge"></div>
                            <div class="combine-slot-sprite"></div>
                            <div class="combine-slot-name"></div>
                        </div>
                    </div>
                </div>
                <div id="combine-rate-table">
                    <div class="combine-rate-title">확률표</div>
                    <div id="combine-rate-rows"></div>
                    <button id="btn-combine-execute" class="dp-btn" disabled>조합</button>
                </div>
            </div>
            <!-- 하단 패널: 필터 + 그리드 -->
            <div id="combine-bottom">
                <div id="combine-filter-bar">
                    <div class="filter-btn-wrapper">
                        <button class="filter-btn" onclick="toggleModal('combine-tier-modal')">등급 ▾</button>
                        <span class="filter-badge" id="combine-filter-badge-tier">0</span>
                        <div id="combine-tier-modal" class="filter-modal">
                            <!-- JS에서 동적 생성 -->
                        </div>
                    </div>
                    <div class="filter-btn-wrapper">
                        <button class="filter-btn" onclick="toggleModal('combine-type-modal')">타입 ▾</button>
                        <span class="filter-badge" id="combine-filter-badge-type">0</span>
                        <div id="combine-type-modal" class="filter-modal">
                            <!-- JS에서 동적 생성 -->
                        </div>
                    </div>
                </div>
                <div id="combine-grid-wrapper" class="grid-wrapper">
                    <div id="combine-grid"></div>
                </div>
            </div>
        </div>

    </div> <!-- /game-container -->
    </div> <!-- /app-wrapper -->

    <!-- ===== 글로벌 모달 (모든 화면 위에 표시) ===== -->
    <div id="login-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div id="login-modal-message" class="modal-message"></div>
            <div id="login-modal-btns" class="modal-btns">
                <button id="login-modal-yes" class="dp-btn">예</button>
                <button id="login-modal-no" class="dp-btn">아니오</button>
            </div>
        </div>
    </div>

    <script src="js/script.js?v=4"></script>
</body>
</html>
